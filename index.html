<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' data:;">
  <title>Kuponų Generatorius</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <h1>Coupon Generator</h1>
    <form id="coupon-form">
      <div class="form-group">
        <label for="amount">Coupon Amount</label>
        <div class="amount-options">
          <label class="radio-label">
            <input type="radio" name="amount" value="100" checked>
            <span class="radio-custom">100 €</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="amount" value="200">
            <span class="radio-custom">200 €</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="amount" value="300">
            <span class="radio-custom">300 €</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="amount" value="400">
            <span class="radio-custom">400 €</span>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label for="valid-until">Valid Until</label>
        <input type="date" id="valid-until" name="validUntil" required>
      </div>

      <button type="submit" id="generate-btn">Generate Coupon</button>
    </form>

    <div id="preview-container" style="display: none; margin-top: 2rem; text-align: center;">
      <h2>Coupon Preview</h2>
      <div id="coupon-preview"
        style="margin-bottom: 1rem; overflow: auto; max-height: 400px; border-radius: 8px; border: 1px solid var(--glass-border);">
      </div>
      <button id="save-pdf-btn" style="background: linear-gradient(135deg, #10b981, #059669);">Save as PDF</button>
    </div>

    <button id="view-coupons-btn"
      style="margin-top: 1.5rem; background: linear-gradient(135deg, #f59e0b, #d97706);">View All Coupons</button>

    <div id="coupons-list-container" style="display: none; margin-top: 2rem;">
      <h2>Generated Coupons</h2>
      <div id="coupons-list" style="max-height: 300px; overflow-y: auto;"></div>
      <button id="close-list-btn"
        style="margin-top: 1rem; background: linear-gradient(135deg, #ef4444, #dc2626);">Close</button>
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>

</html>
